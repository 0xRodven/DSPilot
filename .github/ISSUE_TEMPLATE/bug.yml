name: 🐛 Bug report
description: Signaler un bug dans DSPilot
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce bug. Fournis un maximum de détails pour aider au diagnostic rapide.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Qu'est-ce qui ne marche pas ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur /dashboard/drivers
        2. Cliquer sur ...
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL concernée
      placeholder: https://dspilot.fr/dashboard/...
  - type: input
    id: week
    attributes:
      label: Semaine sélectionnée
      placeholder: S17 / 2026
  - type: textarea
    id: console
    attributes:
      label: Console navigateur (si erreur JS)
      render: text
  - type: input
    id: browser
    attributes:
      label: Navigateur + OS
      placeholder: Chrome 131 / macOS 15.1
